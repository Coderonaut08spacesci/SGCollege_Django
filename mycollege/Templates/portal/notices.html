{% extends "base.html" %}

{% block content %}

<h1>College Notices</h1>

<a href="{% url 'notice_create' %}">Create Notice</a>

{% for notice in notices %}

<div>
    <h2>
        <a href="{% url 'notice_detail' notice.pk %}">
            {{ notice.title }}
        </a>
    </h2>

    <p>{{ notice.category }}</p>
    <p>{{ notice.content|truncatewords:20 }}</p>
    <p>{{ notice.published_date }}</p>

    <a href="{% url 'notice_update' notice.pk %}">Edit</a>
    <a href="{% url 'notice_delete' notice.pk %}">Delete</a>
</div>

{% empty %}

<p>No notices available.</p>

{% endfor %}

{% endblock %}
