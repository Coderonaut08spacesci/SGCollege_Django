{% extends "base.html" %}

{% block content %}

<h1>Delete Notice</h1>

<p>
    Are you sure you want to delete
    "<strong>{{ object.title }}</strong>"?
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit">Yes, Delete</button>

</form>

<a href="{% url 'notice_list' %}">Cancel</a>

{% endblock %}
