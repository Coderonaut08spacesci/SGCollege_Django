{% extends "base.html" %}

{% block title %}
Delete Event | Sunshine Galaxy College
{% endblock %}

{% block content %}

<h1>Delete Event</h1>

<p>
    Are you sure you want to delete
    "<strong>{{ object.title }}</strong>"?
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>

<a href="{% url 'event_list' %}">
    Cancel
</a>

{% endblock %}
